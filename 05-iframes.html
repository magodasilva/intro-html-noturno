<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Conteúdo sobre o uso e aplicação de iframes no HTML.">

        <title>Sobre Iframes | HTML</title>
    </head>

    <body>
        <h1> O que é um Iframe? </h1>
        <p> iframe significa <strong> inline frame </strong>. </p>
        <p> Ele permite que você <em> incorpore </em> outra página/documento dentro da sua própria página HTML. </p>

        <hr>

        <h2> Criando um iframe básico </h2>
        <iframe src="03-listas.html" width="500" height="600" frameborder="0"></iframe>

        <hr>
        <h2> Explorando outras formas de trabalhar com o iframe </h2>
        <h3> Incorporando o YouTube </h3>
        <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/PbchoOWWCZs?si=3y_dvw_YUtVi4D89"
            title="Vídeo do artista Bob Ross ensinando técnicas de pintura. "
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
        ></iframe>

        <h3> Incorporando um mapa no site </h3>
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2417.52251210744!2d-46.565111194088885!3d-23.54169530654874!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce5ef28b4e90c5%3A0xdf02b7d5ccb8e3bc!2sParque%20Municipal%20do%20Tatuap%C3%A9%20(Sampaio%20Moreira)!5e0!3m2!1spt-BR!2sbr!4v1790213013294!5m2!1spt-BR!2sbr"
            width="600" 
            height="450" 
            allowfullscreen=""
            style="border:0;" 
            loading="lazy" 
            referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
    </body>

</html>
